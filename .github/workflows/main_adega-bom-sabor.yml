# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: adega-bom-sabor-backend

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure backend database settings
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          : "${DB_HOST:?DB_HOST repository variable is required}"
          : "${DB_PORT:?DB_PORT repository variable is required}"
          : "${DB_USER:?DB_USER repository secret is required}"
          : "${DB_PASSWORD:?DB_PASSWORD repository secret is required}"
          : "${DB_NAME:?DB_NAME repository variable is required}"
          : "${FIREBASE_SERVICE_ACCOUNT:?FIREBASE_SERVICE_ACCOUNT repository secret is required}"
          : "${FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY repository secret is required}"
          resource_group=$(az webapp list --query "[?name=='adega-bom-sabor'].resourceGroup | [0]" --output tsv)
          if [ -z "$resource_group" ]; then
            echo "Azure Web App adega-bom-sabor was not found or is not accessible."
            exit 1
          fi
          app_is_linux=$(az webapp show \
            --resource-group "$resource_group" \
            --name adega-bom-sabor \
            --query reserved \
            --output tsv)
          if [ "$app_is_linux" = "true" ]; then
            node_runtime=$(az webapp list-runtimes --os linux --output tsv | tr '|' ':' | grep -E '^NODE:22(-lts)?$' | head -n 1 || true)
            if [ -z "$node_runtime" ]; then
              echo "Azure does not list a supported Node.js 22 runtime for Linux App Service."
              az webapp list-runtimes --os linux | grep NODE
              exit 1
            fi
            az webapp config set \
              --resource-group "$resource_group" \
              --name adega-bom-sabor \
              --runtime "$node_runtime" \
              --output none
          else
            node_runtime=$(az webapp list-runtimes --os windows --output tsv | tr '|' ':' | grep -E '^NODE:22(-lts)?$' | head -n 1 || true)
            if [ -z "$node_runtime" ]; then
              echo "Azure does not list a supported Node.js 22 runtime for Windows App Service."
              az webapp list-runtimes --os windows | grep NODE
              exit 1
            fi
            az webapp config appsettings set \
              --resource-group "$resource_group" \
              --name adega-bom-sabor \
              --settings "WEBSITE_NODE_DEFAULT_VERSION=~22" \
              --output none
          fi
          az webapp config appsettings set \
            --resource-group "$resource_group" \
            --name adega-bom-sabor \
            --settings \
              "DB_HOST=$DB_HOST" \
              "DB_PORT=$DB_PORT" \
              "DB_USER=$DB_USER" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "DB_NAME=$DB_NAME" \
              "FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT" \
              "FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              "SCM_DO_BUILD_DURING_DEPLOYMENT=true" \
            --output none

      - name: Deploy backend to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'adega-bom-sabor'
          package: backend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3BA817728A1140D99C687346FA2220AC }}
